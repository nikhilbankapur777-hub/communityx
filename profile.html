<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>community x</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#000;
    --card:#0a0a0a;
    --border:#1a1a1a;
    --accent:#007aff;
    --muted:#666;
    --text:#f2f2f2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk", sans-serif;
    min-height:100vh;
    overscroll-behavior-y:contain;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- top bar (over wallpaper) ---------- */
  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px;
    z-index:5;
  }
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    overflow:hidden;
  }
  .icon-btn:active{ background:rgba(0,0,0,.55); }
  .icon-btn img{ width:18px; height:18px; pointer-events:none; }
  .topbar-title{
    font-size:.92rem;
    font-weight:600;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; position:relative; }

  /* ---------- wallpaper ---------- */
  .wallpaper-wrap{
    position:relative;
    height:230px;
    width:100%;
    overflow:hidden;
    background:#111;
  }
  .wallpaper-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .wallpaper-fade{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, var(--bg) 100%);
  }

  /* ---------- profile head ---------- */
  .profile-head{
    padding:0 20px;
    margin-top:-46px;
    position:relative;
    z-index:2;
  }
  .pfp{
    width:92px; height:92px;
    border-radius:50%;
    border:3px solid var(--bg);
    background:#1a1a1a center/cover no-repeat;
    display:block;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
  }
  .name{
    font-size:1.35rem;
    font-weight:700;
    color:#fff;
  }
  .tick{ width:19px; height:19px; flex-shrink:0; }
  .userid{
    color:var(--muted);
    font-size:.92rem;
    margin-top:3px;
    font-family:"Space Mono", monospace;
  }

  .college-row{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:16px;
    color:#9aa0a6;
    font-size:.86rem;
    cursor:pointer;
    transition:color .15s ease;
  }
  .college-row:hover{ color:var(--accent); }
  .college-row svg{ width:16px; height:16px; flex-shrink:0; }

  .bio{
    margin-top:14px;
    color:#c9c9c9;
    font-size:.94rem;
    line-height:1.5;
    max-width:520px;
  }

  /* ---------- social pills ---------- */
  .pills-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    font-size:.82rem;
    font-weight:500;
    color:#e4e4e4;
    transition:border-color .15s ease, transform .15s ease;
  }
  .pill:hover{ border-color:#333; transform:translateY(-1px); }
  .pill i{ font-size:.95rem; }

  /* ---------- posts / contributions toggle ---------- */
  .section-toggle{
    display:flex;
    gap:8px;
    margin:24px 20px 0;
    padding:4px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:30px;
    width:fit-content;
  }
  .toggle-pill{
    padding:8px 18px;
    border-radius:24px;
    font-size:.82rem;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .toggle-pill.active{
    background:rgba(255,255,255,.09);
    color:#fff;
  }

  .section-body{ padding:18px 20px 40px; display:none; }
  .section-body.active{ display:block; }

  .empty-state{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
    font-size:.94rem;
  }

  .profile-posts{ display:flex; flex-direction:column; gap:18px; }
  .profile-post-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
  }
  .profile-post-media{
    width:100%;
    aspect-ratio:4/5;
    background:#111;
    overflow:hidden;
  }
  .profile-post-media img, .profile-post-media video{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .profile-post-footer{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:14px 14px 16px;
  }
  .profile-post-caption{
    flex:1;
    font-size:.86rem;
    color:#c9c9c9;
    line-height:1.5;
  }
  .profile-post-share{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    cursor:pointer;
  }
  .profile-post-share img{ width:16px; height:16px; }

  /* ---------- not found ---------- */
  .not-found{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
    padding:20px;
    gap:8px;
  }
  .not-found h2{ color:#fff; font-size:1.1rem; font-weight:600; }
  .not-found p{ color:var(--muted); font-size:.88rem; }

  /* ---------- dropdown menu (three-dot) ---------- */
  .dropdown{
    position:absolute;
    top:46px; right:0;
    background:rgba(20,20,20,.55);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:6px;
    min-width:150px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.97);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .dropdown.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:10px;
    font-size:.86rem; color:#eee; cursor:pointer;
  }
  .dropdown-item:active{ background:rgba(255,255,255,.08); }
  .dropdown-item i{ width:16px; text-align:center; color:#9aa0a6; font-size:.9rem; }

  /* ---------- overlays (pfp viewer / share sheet) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay-topbar{
    position:absolute; top:0; left:0; right:0;
    padding:18px 16px;
    z-index:2;
  }

  .pfp-frame{
    width:min(78vw, 320px);
    aspect-ratio:1/1;
    border-radius:28px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#111;
  }
  .pfp-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

  .share-card{
    width:min(88vw,360px);
    max-height:82vh;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .share-title{ font-weight:600; font-size:1rem; color:#fff; }
  .share-link-row{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 9px 9px 14px;
  }
  .share-link-row span{
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.76rem; color:#9aa0a6; font-family:"Space Mono", monospace;
  }
  .copy-btn{
    background:var(--accent); color:#fff; border:none;
    padding:8px 13px; border-radius:10px;
    font-size:.76rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .share-apps{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .share-app{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:.7rem; color:#9aa0a6; cursor:pointer; background:none; border:none;
  }
  .share-app .circle{
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem; color:#fff;
  }
  .share-qr{ display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:4px; }
  .share-qr img{ width:150px; height:150px; border-radius:14px; background:#fff; padding:8px; }
  .share-qr span{ font-size:.74rem; color:var(--muted); }

  .toast{
    position:fixed; bottom:34px; left:50%;
    transform:translateX(-50%);
    background:rgba(24,24,24,.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 18px; border-radius:30px;
    font-size:.82rem; color:#fff;
    z-index:300;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div id="app"></div>

<script>
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var currentProfile = null;
  var openOverlayName = null;
  var postsData = {};
  var shareState = { url:'', message:'' };

  var LINK_META = {
    instagram: { label:'Instagram', icon:'fa-brands fa-instagram', color:'#E1306C' },
    linkedin:  { label:'LinkedIn',  icon:'fa-brands fa-linkedin',  color:'#0A66C2' },
    x:         { label:'X',         icon:'fa-brands fa-x-twitter', color:'#FFFFFF' },
    snapchat:  { label:'Snapchat',  icon:'fa-brands fa-snapchat',  color:'#FFFC00' }
  };

  function renderNotFound(msg){
    document.getElementById('app').innerHTML =
      '<div class="not-found"><h2>Profile not found</h2><p>' + msg + '</p></div>';
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function usernameFromId(rawId){
    return (rawId || '').split('@')[0];
  }

  function render(profile){
    currentProfile = profile;
    var tickHtml = profile.tick ? '<img class="tick" src="' + profile.tick + '" alt="verified">' : '';
    var collegeUrl = profile.collegeUrl || ('https://www.google.com/search?q=' + encodeURIComponent(profile.college || ''));

    var pillsHtml = Object.keys(LINK_META).map(function(key){
      var url = profile.links && profile.links[key];
      if(!url) return '';
      var meta = LINK_META[key];
      return '<a class="pill" href="' + url + '" target="_blank" rel="noopener">' +
        '<i class="' + meta.icon + '" style="color:' + meta.color + '"></i>' + meta.label + '</a>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div class="topbar-left">' +
          '<div class="icon-btn" onclick="history.back()"><img src="assets/back.svg" alt="back"></div>' +
          '<span class="topbar-title">community x</span>' +
        '</div>' +
        '<div class="topbar-right">' +
          '<div class="icon-btn"><img src="assets/ai.svg" alt="ai"></div>' +
          '<div class="icon-btn" id="moreBtn" onclick="toggleMenu(event)"><img src="assets/threedot.svg" alt="more"></div>' +
          '<div class="dropdown" id="dropdown">' +
            '<div class="dropdown-item" onclick="onShareClick()"><img src="assets/share.svg" alt="" style="width:15px;height:15px;">Share</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="wallpaper-wrap">' +
        '<img src="' + profile.wallpaper + '" alt="">' +
        '<div class="wallpaper-fade"></div>' +
      '</div>' +

      '<div class="profile-head">' +
        '<div class="pfp" id="pfpTrigger" onclick="openPfp()" style="background-image:url(\'' + profile.pfp + '\')"></div>' +

        '<div class="name-row">' +
          '<span class="name">' + escapeHtml(profile.name || '') + '</span>' +
          tickHtml +
        '</div>' +
        '<div class="userid">@' + escapeHtml(id) + '</div>' +

        '<a class="college-row" href="' + collegeUrl + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3L2 8.5L12 14L22 8.5L12 3Z" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 11V16.5C6 16.5 8.5 18.5 12 18.5C15.5 18.5 18 16.5 18 16.5V11" stroke="#9aa0a6" stroke-width="1.4"/></svg>' +
          '<span>' + escapeHtml(profile.college || 'College not linked') + '</span>' +
        '</a>' +

        '<div class="bio">' + escapeHtml(profile.bio || 'No bio yet') + '</div>' +

        (pillsHtml ? '<div class="pills-row">' + pillsHtml + '</div>' : '') +
      '</div>' +

      buildPostsSectionHtml() +

      '<div class="overlay" id="pfpOverlay">' +
        '<div class="overlay-topbar"><div class="icon-btn" onclick="closeOverlay()"><img src="assets/back.svg" alt="back"></div></div>' +
        '<div class="pfp-frame"><img src="' + profile.pfp + '" alt=""></div>' +
      '</div>' +

      '<div class="overlay" id="shareOverlay">' +
        '<div class="overlay-topbar"><div class="icon-btn" onclick="closeOverlay()"><img src="assets/back.svg" alt="back"></div></div>' +
        '<div class="share-card">' +
          '<div class="share-title" id="shareTitle">Share profile</div>' +
          '<div class="share-link-row"><span id="shareUrlText"></span><button class="copy-btn" onclick="copyShareLink()">Copy</button></div>' +
          '<div class="share-apps">' +
            '<button class="share-app" onclick="shareVia(\'whatsapp\')"><span class="circle" style="background:#25D366"><i class="fa-brands fa-whatsapp"></i></span>WhatsApp</button>' +
            '<button class="share-app" onclick="shareVia(\'telegram\')"><span class="circle" style="background:#229ED9"><i class="fa-brands fa-telegram"></i></span>Telegram</button>' +
            '<button class="share-app" onclick="shareVia(\'x\')"><span class="circle" style="background:#000;border:1px solid #333"><i class="fa-brands fa-x-twitter"></i></span>X</button>' +
          '</div>' +
          '<div class="share-qr"><img id="shareQrImg" src="" alt="QR code"><span>Scan to open</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="toast" id="toast">Link copied</div>';

    var pfpEl = document.getElementById('pfpTrigger');
    if(pfpEl) pfpEl.style.backgroundImage = "url('" + profile.pfp + "')";
  }

  function buildPostsSectionHtml(){
    var myPosts = Object.keys(postsData).filter(function(postId){
      return postsData[postId].authorId === id;
    });

    var postsHtml = myPosts.length
      ? '<div class="profile-posts">' + myPosts.map(function(postId){
          var post = postsData[postId];
          var mediaHtml = post.type === 'video'
            ? '<video src="' + post.link + '" muted loop playsinline autoplay></video>'
            : '<img src="' + post.link + '" alt="">';
          return (
            '<div class="profile-post-card">' +
              '<div class="profile-post-media">' + mediaHtml + '</div>' +
              '<div class="profile-post-footer">' +
                '<div class="profile-post-caption">' + escapeHtml(post.caption || '') + '</div>' +
                '<div class="profile-post-share" onclick="onPostShare(\'' + postId + '\')"><img src="assets/share.svg" alt="share"></div>' +
              '</div>' +
            '</div>'
          );
        }).join('') + '</div>'
      : '<div class="empty-state">No posts yet</div>';

    return (
      '<div class="section-toggle">' +
        '<div class="toggle-pill active" id="togglePosts" onclick="showSection(\'posts\')">Posts</div>' +
        '<div class="toggle-pill" id="toggleContrib" onclick="showSection(\'contributions\')">Contributions</div>' +
      '</div>' +
      '<div class="section-body active" id="postsSection">' + postsHtml + '</div>' +
      '<div class="section-body" id="contribSection"><div class="empty-state">Contributions is empty</div></div>'
    );
  }

  function showSection(name){
    document.getElementById('postsSection').classList.toggle('active', name === 'posts');
    document.getElementById('contribSection').classList.toggle('active', name === 'contributions');
    document.getElementById('togglePosts').classList.toggle('active', name === 'posts');
    document.getElementById('toggleContrib').classList.toggle('active', name === 'contributions');
  }

  /* ---------- dropdown menu ---------- */
  function toggleMenu(e){
    if(e) e.stopPropagation();
    var dd = document.getElementById('dropdown');
    dd.classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    var dd = document.getElementById('dropdown');
    var moreBtn = document.getElementById('moreBtn');
    if(dd && dd.classList.contains('open') && !dd.contains(e.target) && e.target !== moreBtn && !moreBtn.contains(e.target)){
      dd.classList.remove('open');
    }
  });

  /* ---------- overlay stack (back-button aware) ---------- */
  function openOverlayEl(name){
    document.getElementById('dropdown').classList.remove('open');
    openOverlayName = name;
    document.getElementById(name).classList.add('open');
    history.pushState({ overlay:name }, '', window.location.href);
  }
  function closeOverlay(){
    history.back();
  }
  window.addEventListener('popstate', function(){
    if(openOverlayName){
      var el = document.getElementById(openOverlayName);
      if(el) el.classList.remove('open');
      openOverlayName = null;
    }
  });

  function openPfp(){
    openOverlayEl('pfpOverlay');
  }

  function onShareClick(){
    document.getElementById('dropdown').classList.remove('open');
    var url = window.location.href;
    shareState = { url:url, message: shareMessage() };
    document.getElementById('shareTitle').textContent = 'Share profile';
    document.getElementById('shareUrlText').textContent = url;
    document.getElementById('shareQrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    openOverlayEl('shareOverlay');
  }

  function onPostShare(postId){
    var post = postsData[postId];
    var url = 'https://nikhilbankapur777-hub.github.io/communityx/index.html?post=' + encodeURIComponent(postId);
    shareState = { url:url, message:'Check out this post by ' + (currentProfile.name || id) + ' on community x' };
    document.getElementById('shareTitle').textContent = 'Share post';
    document.getElementById('shareUrlText').textContent = url;
    document.getElementById('shareQrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    openOverlayEl('shareOverlay');
  }

  function shareMessage(){
    return 'Take a look at community ' + usernameFromId(id);
  }

  function shareVia(app){
    var url = shareState.url;
    var text = shareState.message;
    var target = '';
    if(app === 'whatsapp'){
      target = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
    } else if(app === 'telegram'){
      target = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
    } else if(app === 'x'){
      target = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    }
    if(target) window.open(target, '_blank', 'noopener');
  }

  function copyShareLink(){
    var url = shareState.url;
    function showToast(){
      var t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(showToast).catch(showToast);
    } else {
      var ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      showToast();
    }
  }

  /* ---------- boot ---------- */
  if(!id){
    renderNotFound('No profile id was given in the link.');
  } else {
    loadData();
  }

  function fetchJson(paths){
    var path = paths[0];
    return fetch(path).then(function(res){
      if(!res.ok) throw new Error('not ok');
      return res.json();
    }).catch(function(err){
      if(paths.length > 1) return fetchJson(paths.slice(1));
      throw err;
    });
  }

  function loadData(){
    Promise.all([
      fetchJson(['assets/profiles.json', 'profiles.json']),
      fetchJson(['assets/posts.json', 'posts.json']).catch(function(){ return {}; })
    ]).then(function(results){
      var profiles = results[0];
      postsData = results[1];
      var profile = profiles[id];
      if(!profile){
        renderNotFound('There\'s no profile registered under "' + id + '".');
        return;
      }
      render(profile);
    }).catch(function(){
      renderNotFound('Could not load profiles.json. Make sure it sits at assets/profiles.json or profiles.json next to profile.html.');
    });
  }
</script>
</body>
</html>
