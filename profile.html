<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>community x</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --card:#0a0a0a;
    --border:#1a1a1a;
    --accent:#007aff;
    --muted:#666;
    --text:#f2f2f2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk", sans-serif;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- top bar (over wallpaper) ---------- */
  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px;
    z-index:5;
  }
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
  }
  .icon-btn img{ width:18px; height:18px; }
  .topbar-title{
    font-size:.92rem;
    font-weight:600;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }

  /* ---------- wallpaper ---------- */
  .wallpaper-wrap{
    position:relative;
    height:230px;
    width:100%;
    overflow:hidden;
    background:#111;
  }
  .wallpaper-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .wallpaper-fade{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, var(--bg) 100%);
  }

  /* ---------- profile head ---------- */
  .profile-head{
    padding:0 20px;
    margin-top:-46px;
    position:relative;
    z-index:2;
  }
  .pfp{
    width:92px; height:92px;
    border-radius:50%;
    border:3px solid var(--bg);
    background:#1a1a1a center/cover no-repeat;
    display:block;
  }
  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
  }
  .name{
    font-size:1.35rem;
    font-weight:700;
    color:#fff;
  }
  .tick{ width:19px; height:19px; flex-shrink:0; }
  .userid{
    color:var(--muted);
    font-size:.92rem;
    margin-top:3px;
    font-family:"Space Mono", monospace;
  }

  .college-row{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:16px;
    color:#9aa0a6;
    font-size:.86rem;
    cursor:pointer;
    transition:color .15s ease;
  }
  .college-row:hover{ color:var(--accent); }
  .college-row svg{ width:16px; height:16px; flex-shrink:0; }

  .bio{
    margin-top:14px;
    color:#c9c9c9;
    font-size:.94rem;
    line-height:1.5;
    max-width:520px;
  }

  /* ---------- social pills ---------- */
  .pills-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    font-size:.82rem;
    font-weight:500;
    color:#e4e4e4;
    transition:border-color .15s ease, transform .15s ease;
  }
  .pill:hover{ border-color:#333; transform:translateY(-1px); }
  .pill img{ width:15px; height:15px; }

  /* ---------- divider ---------- */
  .divider{
    height:1px;
    background:var(--border);
    margin:24px 20px 0;
  }

  /* ---------- contributions ---------- */
  .section-label{
    padding:22px 20px 0;
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.08em;
    color:var(--muted);
  }
  .empty-state{
    margin:0 20px;
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
    font-size:.94rem;
  }

  /* ---------- not found ---------- */
  .not-found{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
    padding:20px;
    gap:8px;
  }
  .not-found h2{ color:#fff; font-size:1.1rem; font-weight:600; }
  .not-found p{ color:var(--muted); font-size:.88rem; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const TICKS = {
    verifiedg: 'assets/verified-gold.svg',
    verifiedb: 'assets/verified-blue.svg'
  };

  const LINK_META = {
    instagram: { label:'Instagram', icon:'assets/icons/instagram.svg' },
    linkedin:  { label:'LinkedIn',  icon:'assets/icons/linkedin.svg' },
    x:         { label:'X',         icon:'assets/icons/x.svg' },
    snapchat:  { label:'Snapchat',  icon:'assets/icons/snapchat.svg' }
  };

  function renderNotFound(msg){
    document.getElementById('app').innerHTML =
      '<div class="not-found"><h2>Profile not found</h2><p>' + msg + '</p></div>';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function render(profile){
    const tickSrc = TICKS[profile.tick];
    const tickHtml = tickSrc ? '<img class="tick" src="' + tickSrc + '" alt="verified">' : '';

    const collegeUrl = profile.collegeUrl || ('https://www.google.com/search?q=' + encodeURIComponent(profile.college || ''));

    const pillsHtml = Object.keys(LINK_META).map(function(key){
      const url = profile.links && profile.links[key];
      if(!url) return '';
      const meta = LINK_META[key];
      return '<a class="pill" href="' + url + '" target="_blank" rel="noopener">' +
        '<img src="' + meta.icon + '" alt="' + meta.label + '">' + meta.label + '</a>';
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="topbar">
        <div class="topbar-left">
          <div class="icon-btn" onclick="history.back()"><img src="assets/back.svg" alt="back"></div>
          <span class="topbar-title">community x</span>
        </div>
        <div class="topbar-right">
          <div class="icon-btn"><img src="assets/ai.svg" alt="ai"></div>
          <div class="icon-btn"><img src="assets/threedot.svg" alt="more"></div>
        </div>
      </div>

      <div class="wallpaper-wrap">
        <img src="${profile.wallpaper}" alt="">
        <div class="wallpaper-fade"></div>
      </div>

      <div class="profile-head">
        <div class="pfp" style="background-image:url('${profile.pfp}')"></div>

        <div class="name-row">
          <span class="name">${escapeHtml(profile.name || '')}</span>
          ${tickHtml}
        </div>
        <div class="userid">@${escapeHtml(id)}</div>

        <a class="college-row" href="${collegeUrl}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L2 8.5L12 14L22 8.5L12 3Z" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 11V16.5C6 16.5 8.5 18.5 12 18.5C15.5 18.5 18 16.5 18 16.5V11" stroke="#9aa0a6" stroke-width="1.4"/></svg>
          <span>${escapeHtml(profile.college || 'College not linked')}</span>
        </a>

        <div class="bio">${escapeHtml(profile.bio || 'No bio yet')}</div>

        ${pillsHtml ? '<div class="pills-row">' + pillsHtml + '</div>' : ''}
      </div>

      <div class="divider"></div>
      <div class="section-label">CONTRIBUTIONS</div>
      <div class="empty-state">Contributions is empty</div>
    `;
  }

  if(!id){
    renderNotFound('No profile id was given in the link.');
    return;
  }

  function loadProfiles(paths){
    const path = paths[0];
    return fetch(path).then(function(res){
      if(!res.ok) throw new Error('not ok');
      return res.json();
    }).catch(function(err){
      if(paths.length > 1) return loadProfiles(paths.slice(1));
      throw err;
    });
  }

  loadProfiles(['assets/profiles.json', 'profiles.json'])
    .then(function(data){
      const profile = data[id];
      if(!profile){
        renderNotFound('There\'s no profile registered under "' + id + '".');
        return;
      }
      render(profile);
    })
    .catch(function(){
      renderNotFound('Could not load profiles.json. Make sure it sits at assets/profiles.json or profiles.json next to profile.html.');
    });
})();
</script>
</body>
</html>
