<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>community x</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#000;
    --card:#0a0a0a;
    --border:#1a1a1a;
    --accent:#007aff;
    --muted:#666;
    --text:#f2f2f2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk", sans-serif;
    min-height:100vh;
    overscroll-behavior-y:contain;
  }
  a{ color:inherit; text-decoration:none; }
  button, input{ font-family:inherit; }
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- top bar ---------- */
  .top-bar{
    position:fixed;
    top:18px; left:16px; right:16px;
    height:44px;
    z-index:30;
  }
  .glass{
    background:rgba(20,20,20,.55);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.08);
  }
  .logo-pill{
    position:absolute; left:0; top:0;
    width:44px; height:44px;
    border-radius:50%;
    overflow:hidden;
  }
  .logo-pill img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-pill{
    position:absolute; left:50%; top:0;
    transform:translateX(-50%);
    height:44px;
    padding:0 18px;
    border-radius:30px;
    display:flex; align-items:center;
    font-weight:600;
    font-size:.92rem;
    letter-spacing:.02em;
    color:#fff;
    white-space:nowrap;
  }
  .topbar-right{
    position:absolute; right:0; top:0;
  }
  .icon-btn{
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .icon-btn img{ width:18px; height:18px; pointer-events:none; }
  .dropdown{
    position:absolute;
    top:52px; right:0;
    background:rgba(20,20,20,.55);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:6px;
    min-width:150px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.97);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .dropdown.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:10px;
    font-size:.86rem; color:#eee; cursor:pointer;
  }
  .dropdown-item:active{ background:rgba(255,255,255,.08); }
  .dropdown-item img{ width:15px; height:15px; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    bottom:18px; left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:2px;
    padding:4px;
    border-radius:32px;
    z-index:30;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    padding:7px 14px;
    border-radius:24px;
    cursor:pointer;
    color:#8a8f96;
    transition:background .15s ease, color .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .nav-item img{ width:15px; height:15px; opacity:.75; transition:opacity .15s ease; }
  .nav-item i{ font-size:.9rem; opacity:.75; }
  .nav-item span{ font-size:.56rem; font-weight:500; }
  .nav-item.active{ background:rgba(255,255,255,.09); color:#fff; }
  .nav-item.active img, .nav-item.active i{ opacity:1; }

  /* ---------- tabs ---------- */
  .tab{ display:none; }
  .tab.active{ display:block; }

  /* ---------- explore feed ---------- */
  .feed{
    padding:90px 16px 130px;
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .post-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    overflow:hidden;
  }
  .post-media{
    width:100%;
    aspect-ratio:4/5;
    background:#111;
    overflow:hidden;
  }
  .post-media img, .post-media video{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .post-meta{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 14px 4px;
    cursor:pointer;
  }
  .post-pfp{
    width:36px; height:36px;
    border-radius:50%;
    background:#1a1a1a center/cover no-repeat;
    flex-shrink:0;
  }
  .post-author{ display:flex; flex-direction:column; min-width:0; }
  .post-name-row{ display:flex; align-items:center; gap:5px; }
  .post-name{ font-size:.86rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .post-tick{ width:14px; height:14px; flex-shrink:0; }
  .post-id{ font-size:.72rem; color:var(--muted); font-family:"Space Mono", monospace; }
  .post-share{
    margin-left:auto;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    cursor:pointer;
    flex-shrink:0;
  }
  .post-share img{ width:16px; height:16px; }
  .post-caption{
    padding:8px 16px 16px;
    font-size:.86rem;
    color:#c9c9c9;
    line-height:1.5;
  }
  .feed-empty{ text-align:center; color:var(--muted); padding:60px 20px; font-size:.9rem; }

  /* ---------- search ---------- */
  .search-wrap{
    padding:90px 18px 130px;
    max-width:520px;
    margin:0 auto;
  }
  .search-input{
    width:100%;
    padding:14px 18px;
    border-radius:30px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    color:#fff;
    font-size:.9rem;
  }
  .search-input::placeholder{ color:var(--muted); }
  .search-results{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 8px;
    border-radius:16px;
    cursor:pointer;
  }
  .search-row:active{ background:rgba(255,255,255,.05); }
  .search-pfp{
    width:46px; height:46px;
    border-radius:50%;
    background:#1a1a1a center/cover no-repeat;
    flex-shrink:0;
  }
  .search-info{ display:flex; flex-direction:column; min-width:0; }
  .search-name-row{ display:flex; align-items:center; gap:5px; }
  .search-name{ font-size:.9rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-tick{ width:14px; height:14px; flex-shrink:0; }
  .search-id{ font-size:.78rem; color:var(--muted); font-family:"Space Mono", monospace; }
  .search-empty{ text-align:center; color:var(--muted); padding:50px 20px; font-size:.88rem; }

  /* ---------- share overlay (shared with post & profile shares) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay-topbar{ position:absolute; top:0; left:0; right:0; padding:18px 16px; z-index:2; }
  .overlay-icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
  }
  .overlay-icon-btn img{ width:18px; height:18px; }
  .share-card{
    width:min(88vw,360px);
    max-height:82vh;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .share-title{ font-weight:600; font-size:1rem; color:#fff; }
  .share-link-row{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 9px 9px 14px;
  }
  .share-link-row span{
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.76rem; color:#9aa0a6; font-family:"Space Mono", monospace;
  }
  .copy-btn{
    background:var(--accent); color:#fff; border:none;
    padding:8px 13px; border-radius:10px;
    font-size:.76rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .share-apps{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .share-app{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:.7rem; color:#9aa0a6; cursor:pointer; background:none; border:none;
  }
  .share-app .circle{
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem; color:#fff;
  }
  .share-qr{ display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:4px; }
  .share-qr img{ width:150px; height:150px; border-radius:14px; background:#fff; padding:8px; }
  .share-qr span{ font-size:.74rem; color:var(--muted); }

  .toast{
    position:fixed; bottom:100px; left:50%;
    transform:translateX(-50%);
    background:rgba(24,24,24,.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 18px; border-radius:30px;
    font-size:.82rem; color:#fff;
    z-index:300;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="logo-pill glass"><img src="assets/logo.png" alt="community x"></div>
    <div class="brand-pill glass">community x</div>
    <div class="topbar-right">
      <div class="icon-btn glass" id="moreBtn" onclick="toggleMenu(event)"><img src="assets/threedot.svg" alt="more"></div>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-item" onclick="onAppShare()"><img src="assets/share.svg" alt="">Share</div>
      </div>
    </div>
  </div>

  <div id="exploreTab" class="tab active">
    <div class="feed" id="feed"></div>
  </div>

  <div id="searchTab" class="tab">
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="Search people">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="bottom-nav glass">
    <div class="nav-item active" id="navExplore" onclick="showTab('explore')">
      <img src="assets/explore.svg" alt="">
      <span>Explore</span>
    </div>
    <div class="nav-item" id="navSearch" onclick="showTab('search')">
      <img src="assets/search.svg" alt="">
      <span>Search</span>
    </div>
    <div class="nav-item" id="navAbout" onclick="showAboutComingSoon()">
      <img src="assets/about.svg" alt="">
      <span>About</span>
    </div>
  </div>

  <div class="overlay" id="shareOverlay">
    <div class="overlay-topbar"><div class="overlay-icon-btn" onclick="closeOverlay()"><img src="assets/back.svg" alt="back"></div></div>
    <div class="share-card">
      <div class="share-title" id="shareTitle">Share</div>
      <div class="share-link-row"><span id="shareUrlText"></span><button class="copy-btn" onclick="copyShareLink()">Copy</button></div>
      <div class="share-apps">
        <button class="share-app" onclick="shareVia('whatsapp')"><span class="circle" style="background:#25D366"><i class="fa-brands fa-whatsapp"></i></span>WhatsApp</button>
        <button class="share-app" onclick="shareVia('telegram')"><span class="circle" style="background:#229ED9"><i class="fa-brands fa-telegram"></i></span>Telegram</button>
        <button class="share-app" onclick="shareVia('x')"><span class="circle" style="background:#000;border:1px solid #333"><i class="fa-brands fa-x-twitter"></i></span>X</button>
      </div>
      <div class="share-qr"><img id="shareQrImg" src="" alt="QR code"><span>Scan to open</span></div>
    </div>
  </div>

  <div class="toast" id="toast">Link copied</div>

<script>
  var profilesData = {};
  var postsData = {};
  var openOverlayName = null;
  var shareState = { url:'', text:'' };

  function escapeHtml(str){
    var d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function fetchJson(paths){
    var path = paths[0];
    return fetch(path).then(function(res){
      if(!res.ok) throw new Error('not ok');
      return res.json();
    }).catch(function(err){
      if(paths.length > 1) return fetchJson(paths.slice(1));
      throw err;
    });
  }

  /* ---------- top-bar dropdown ---------- */
  function toggleMenu(e){
    if(e) e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    var dd = document.getElementById('dropdown');
    var moreBtn = document.getElementById('moreBtn');
    if(dd && dd.classList.contains('open') && !dd.contains(e.target) && e.target !== moreBtn && !moreBtn.contains(e.target)){
      dd.classList.remove('open');
    }
  });

  function onAppShare(){
    document.getElementById('dropdown').classList.remove('open');
    var url = window.location.href;
    shareState = { url:url, text:'Check out community x' };
    document.getElementById('shareTitle').textContent = 'Share community x';
    document.getElementById('shareUrlText').textContent = url;
    document.getElementById('shareQrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    openOverlayEl('shareOverlay');
  }

  /* ---------- tabs ---------- */
  function showTab(name){
    document.getElementById('exploreTab').classList.toggle('active', name === 'explore');
    document.getElementById('searchTab').classList.toggle('active', name === 'search');
    document.getElementById('navExplore').classList.toggle('active', name === 'explore');
    document.getElementById('navSearch').classList.toggle('active', name === 'search');
    if(name === 'search'){
      document.getElementById('searchInput').focus();
    }
  }

  function renderFeed(){
    var feedEl = document.getElementById('feed');
    var ids = Object.keys(postsData);
    if(ids.length === 0){
      feedEl.innerHTML = '<div class="feed-empty">No posts yet</div>';
      return;
    }
    feedEl.innerHTML = ids.map(function(postId){
      var post = postsData[postId];
      var author = profilesData[post.authorId] || {};
      var tickHtml = author.tick ? '<img class="post-tick" src="' + author.tick + '" alt="">' : '';
      var mediaHtml = post.type === 'video'
        ? '<video src="' + post.link + '" muted loop playsinline autoplay></video>'
        : '<img src="' + post.link + '" alt="">';

      return (
        '<div class="post-card">' +
          '<div class="post-media">' + mediaHtml + '</div>' +
          '<div class="post-meta" onclick="goToProfile(\'' + post.authorId + '\')">' +
            '<div class="post-pfp" style="background-image:url(\'' + (author.pfp || '') + '\')"></div>' +
            '<div class="post-author">' +
              '<div class="post-name-row"><span class="post-name">' + escapeHtml(author.name || post.authorId) + '</span>' + tickHtml + '</div>' +
              '<div class="post-id">#' + escapeHtml(post.authorId) + '</div>' +
            '</div>' +
            '<div class="post-share" onclick="event.stopPropagation(); onPostShare(\'' + postId + '\')"><img src="assets/share.svg" alt="share"></div>' +
          '</div>' +
          '<div class="post-caption">' + escapeHtml(post.caption || '') + '</div>' +
        '</div>'
      );
    }).join('');
  }

  function goToProfile(profileId){
    window.location.href = 'profile.html?id=' + encodeURIComponent(profileId);
  }

  function showAboutComingSoon(){
    var t = document.getElementById('toast');
    t.textContent = 'About — coming soon';
    t.classList.add('show');
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.textContent = 'Link copied'; }, 200);
    }, 1800);
  }

  /* ---------- search ---------- */
  function renderSearchResults(query){
    var resultsEl = document.getElementById('searchResults');
    var q = (query || '').trim().toLowerCase();
    var ids = Object.keys(profilesData);

    var matches = q === ''
      ? ids
      : ids.filter(function(pid){
          var p = profilesData[pid];
          return pid.toLowerCase().indexOf(q) !== -1 ||
                 (p.name || '').toLowerCase().indexOf(q) !== -1;
        });

    if(matches.length === 0){
      resultsEl.innerHTML = '<div class="search-empty">No people found</div>';
      return;
    }

    resultsEl.innerHTML = matches.map(function(pid){
      var p = profilesData[pid];
      var tickHtml = p.tick ? '<img class="search-tick" src="' + p.tick + '" alt="">' : '';
      return (
        '<div class="search-row" onclick="goToProfile(\'' + pid + '\')">' +
          '<div class="search-pfp" style="background-image:url(\'' + (p.pfp || '') + '\')"></div>' +
          '<div class="search-info">' +
            '<div class="search-name-row"><span class="search-name">' + escapeHtml(p.name || pid) + '</span>' + tickHtml + '</div>' +
            '<div class="search-id">#' + escapeHtml(pid) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('input', function(e){
    renderSearchResults(e.target.value);
  });

  /* ---------- overlay stack (back-button aware) ---------- */
  function openOverlayEl(name){
    openOverlayName = name;
    document.getElementById(name).classList.add('open');
    history.pushState({ overlay:name }, '', window.location.href);
  }
  function closeOverlay(){
    history.back();
  }
  window.addEventListener('popstate', function(){
    if(openOverlayName){
      var el = document.getElementById(openOverlayName);
      if(el) el.classList.remove('open');
      openOverlayName = null;
    }
  });

  /* ---------- share ---------- */
  function onPostShare(postId){
    var post = postsData[postId];
    var author = profilesData[post.authorId] || {};
    var url = window.location.origin + window.location.pathname + '?post=' + encodeURIComponent(postId);
    var text = 'Check out this post by ' + (author.name || post.authorId) + ' on community x';
    shareState = { url:url, text:text };
    document.getElementById('shareTitle').textContent = 'Share post';
    document.getElementById('shareUrlText').textContent = url;
    document.getElementById('shareQrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    openOverlayEl('shareOverlay');
  }

  function shareVia(app){
    var url = shareState.url;
    var text = shareState.text;
    var target = '';
    if(app === 'whatsapp'){
      target = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
    } else if(app === 'telegram'){
      target = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
    } else if(app === 'x'){
      target = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    }
    if(target) window.open(target, '_blank', 'noopener');
  }

  function copyShareLink(){
    var url = shareState.url;
    function showToast(){
      var t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(showToast).catch(showToast);
    } else {
      var ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      showToast();
    }
  }

  /* ---------- boot ---------- */
  Promise.all([
    fetchJson(['assets/profiles.json', 'profiles.json']),
    fetchJson(['assets/posts.json', 'posts.json'])
  ]).then(function(results){
    profilesData = results[0];
    postsData = results[1];
    renderFeed();
    renderSearchResults('');
  }).catch(function(){
    document.getElementById('feed').innerHTML = '<div class="feed-empty">Could not load profiles.json or posts.json from assets/.</div>';
  });
</script>
</body>
</html>
